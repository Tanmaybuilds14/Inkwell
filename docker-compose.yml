services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inkwell
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Full local stack: docker compose --profile app up --build
  sync:
    profiles: ["app"]
    build:
      context: ./sync-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/inkwell
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      SYNC_PORT: "1234"
    ports:
      - "1234:1234"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Two sync instances to exercise cross-server broadcast locally.
  sync2:
    profiles: ["app"]
    build:
      context: ./sync-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/inkwell
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      SYNC_PORT: "1234"
    ports:
      - "1235:1234"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SYNC_WS_URL: ws://localhost:1234
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/inkwell
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
