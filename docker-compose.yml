services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Full local stack: docker compose --profile app up --build
  sync:
    profiles: ["app"]
    build:
      context: ./sync-service
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      SYNC_PORT: "1234"
    ports:
      - "1234:1234"
    depends_on:
      redis:
        condition: service_healthy

  # Two sync instances to exercise cross-server broadcast locally.
  sync2:
    profiles: ["app"]
    build:
      context: ./sync-service
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      SYNC_PORT: "1234"
    ports:
      - "1235:1234"
    depends_on:
      redis:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SYNC_WS_URL: ws://localhost:1234
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
